name: Test and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm pack --ignore-scripts

  release:
    needs: test
    if: github.repository == 'liuweiqiang2016/dsh-openai-usage' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = 'v' + $package.version
          $tags = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check existing releases' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "exists=$(@($tags) -contains $tag)" >> $env:GITHUB_OUTPUT
      - if: steps.version.outputs.exists == 'False'
        run: npm ci --ignore-scripts
      - if: steps.version.outputs.exists == 'False'
        run: npm run build
      - name: Publish the prebuilt tarball
        if: steps.version.outputs.exists == 'False'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          npm pack --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Package build failed' }
          $archive = "$($package.name)-$($package.version).tgz"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content SHA256SUMS -Encoding utf8NoBOM
          gh release create $env:RELEASE_TAG $archive SHA256SUMS --target $env:GITHUB_SHA --title "OpenAI Usage $env:RELEASE_TAG" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
